<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Scholars - Mwanza</title>
<style>
*{box-sizing:border-box} body{font-family:Arial,sans-serif;background:#f0f2f5;margin:0;padding:0}
.header{background:#1877f2;color:white;padding:18px;text-align:center}
.header h1{margin:0;font-size:24px}.header p{margin:5px 0 0;opacity:.9}
.container{max-width:600px;margin:auto;padding:12px}
.card{background:white;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
input,select,textarea{width:100%;padding:11px;margin:6px 0;border:1px solid #ddd;border-radius:8px;font-size:15px}
button{background:#1877f2;color:white;border:none;padding:12px;border-radius:8px;width:100%;font-size:16px;font-weight:bold;cursor:pointer}
button:active{opacity:.8}
.post{border-top:1px solid #eee;padding:12px 0}
.post b{font-size:16px}.post small{color:#666}
.badge{background:#e7f3ff;color:#1877f2;padding:3px 8px;border-radius:20px;font-size:12px;font-weight:bold}
.chat-box{height:320px;overflow-y:auto;background:#f7f8fa;border:1px solid #eee;border-radius:10px;padding:10px;margin:10px 0;display:flex;flex-direction:column;gap:8px}
.msg{background:white;padding:9px 12px;border-radius:12px;max-width:85%;box-shadow:0 1px 2px rgba(0,0,0,.08);align-self:flex-start}
.msg.mine{background:#d9fdd3;align-self:flex-end}
.msg b{font-size:13px;color:#1877f2;display:block}
.msg span{font-size:14px}
.msg small{font-size:11px;color:#888}
.chat-row{display:flex;gap:8px}.chat-row input{flex:1}.chat-row button{width:80px}
</style>
</head>
<body>
<div class="header"><h1>📚 Social Scholars</h1><p>Study Together • Mwanza • Tanzania</p></div>
<div class="container">

<div class="card">
<h3>👋 Welcome! Karibu</h3>
<input id="userName" placeholder="Your Name e.g. Baraka">
<select id="userClass"><option>Form 1</option><option>Form 2</option><option>Form 3</option><option>Form 4</option><option>Form 5</option><option>Form 6</option></select>
<button onclick="saveUser()">Save My Name ✅</button>
<p id="hello" style="text-align:center;color:#1877f2;font-weight:bold"></p>
</div>

<div class="card">
<h3>📤 Share Study Material</h3>
<input id="title" placeholder="Title e.g. Biology Photosynthesis">
<select id="subject"><option>Biology</option><option>Chemistry</option><option>Physics</option><option>Maths</option><option>English</option><option>History</option><option>Geography</option><option>Kiswahili</option><option>Civics</option><option>Other</option></select>
<input id="link" placeholder="Link - YouTube / PDF / Google Drive">
<textarea id="desc" placeholder="Describe it..."></textarea>
<button onclick="postMaterial()">Post For Everyone →</button>
</div>

<div class="card">
<h3>🔍 Search Materials</h3>
<input id="search" placeholder="Search Biology, Chemistry..." oninput="render()">
</div>

<div class="card">
<h3>📚 Latest Materials</h3>
<div id="feed">Loading...</div>
</div>

<div class="card">
<h3>💬 Students Group Chat - Everyone</h3>
<p style="font-size:13px;color:#666">Chat with all students in Mwanza! Be kind ❤️</p>
<div class="chat-box" id="chatBox"><p style="text-align:center;color:#999">No messages yet. Say Hi! 👋</p></div>
<div class="chat-row">
<input id="chatInput" placeholder="Type message... e.g. Anyone has Chemistry notes?">
<button onclick="sendChat()">Send</button>
</div>
</div>

<p style="text-align:center;color:#888;font-size:13px">Made in Mwanza 🇹🇿 by Baraka</p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// 👇 PASTE YOUR OLD CONFIG HERE - Replace this whole block with the one you copied in Step 1
const firebaseConfig = {apiKey:"AIzaSyDc74Y4KbYFlmdA6mDnii92E_vvh83vJLE",authDomain:"social-scholars-e595e.firebaseapp.com",projectId:"social-scholars-e595e",storageBucket:"social-scholars-e595e.firebasestorage.app",messagingSenderId:"285145417840",appId:"1:285145417840:web:a45210e321ac94b8e88cb5"};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
signInAnonymously(auth).catch(e=>console.log(e));

let allPosts = [];
let myName = localStorage.getItem('ss_name') || '';
if(myName){ document.getElementById('userName').value=myName; document.getElementById('hello').innerText='Hi '+myName+' 👋'; }

window.saveUser = ()=>{
  myName = document.getElementById('userName').value.trim() || 'Student';
  localStorage.setItem('ss_name', myName);
  document.getElementById('hello').innerText='Hi '+myName+' 👋 Asante!';
}

window.postMaterial = async ()=>{
  const t=document.getElementById('title').value.trim();
  const l=document.getElementById('link').value.trim();
  if(!t||!l){ alert('Please add Title and Link'); return; }
  if(!myName) myName='Student';
  try{
    await addDoc(collection(db,'posts'),{
      title:t, subject:document.getElementById('subject').value,
      link:l, desc:document.getElementById('desc').value,
      name:myName, class:document.getElementById('userClass').value,
      createdAt: serverTimestamp()
    });
    alert('Posted! Asante!'); document.getElementById('title').value=''; document.getElementById('link').value=''; document.getElementById('desc').value='';
  }catch(e){ alert('Error: '+e.message); }
};

window.render = ()=>{
  const q=document.getElementById('search').value.toLowerCase();
  const f=allPosts.filter(p=>(p.title+' '+p.subject+' '+p.desc).toLowerCase().includes(q));
  if(f.length===0){ document.getElementById('feed').innerHTML='<p>No materials yet. Be first to post! 📚</p>'; return; }
  document.getElementById('feed').innerHTML=f.map(p=>`
    <div class="post"><span class="badge">${p.subject||''}</span> <b>${p.title}</b><br>
    <small>By ${p.name||'Student'} • ${p.class||''}</small><br>
    <span>${p.desc||''}</span><br>
    <a href="${p.link}" target="_blank">📎 Open Material →</a></div>`).join('');
};

onSnapshot(query(collection(db,'posts'),orderBy('createdAt','desc')),(snap)=>{
  allPosts=snap.docs.map(d=>d.data()); render();
});

// --- GROUP CHAT ---
window.sendChat = async ()=>{
  const inp=document.getElementById('chatInput');
  const text=inp.value.trim();
  if(!text) return;
  if(!myName) myName=document.getElementById('userName').value.trim()||'Student';
  try{
    await addDoc(collection(db,'chat'),{ text, name:myName, createdAt: serverTimestamp() });
    inp.value='';
  }catch(e){ alert('Chat Error: '+e.message); }
};

onSnapshot(query(collection(db,'chat'),orderBy('createdAt','asc')),(snap)=>{
  const box=document.getElementById('chatBox');
  if(snap.empty){ box.innerHTML='<p style="text-align:center;color:#999">No messages yet. Say Hi! 👋</p>'; return; }
  box.innerHTML=snap.docs.map(d=>{
    const m=d.data();
    const isMine = m.name===myName;
    return `<div class="msg ${isMine?'mine':''}"><b>${m.name||'Student'}</b><span>${m.text}</span><br><small>${m.name===myName?'You':''}</small></div>`;
  }).join('');
  box.scrollTop=box.scrollHeight;
});

document.getElementById('chatInput').addEventListener('keypress',e=>{ if(e.key==='Enter') sendChat(); });
</script>
</body>
  </html>
